# ==============================================================================
# Docker Compose для ЗАРУБЕЖНОГО СЕРВЕРА (Только легкий Telegram-бот)
# ==============================================================================
# Разворачивается на зарубежном VPS.
# Отвечает только за Telegram-интерфейс и соединение с серверами api.telegram.org.
# Не скачивает видео и не обращается к GigaChat — всё делегирует в РФ!
# ==============================================================================

version: '3.8'

services:
  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: olymp_telegram_bot
    restart: always
    environment:
      # 1. Telegram Bot Token
      - BOT_TOKEN=${BOT_TOKEN}

      # 2. Подключение к PostgreSQL на Российском сервере
      - DB_TYPE=postgres
      - DB_HOST=${DB_HOST}              # Публичный IP или домен Российского сервера
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-lecture_db}

      # 3. Режим удаленной обработки: вся медиа/ИИ нагрузка происходит в РФ!
      - REMOTE_PROCESSOR_MODE=true

      # 4. Базовый публичный адрес Российского веб-сервера
      # Используется ботом для генерации кнопок веб-отчетов для кураторов
      - WEB_BASE_URL=${WEB_BASE_URL}     # Например: https://metodist.your-domain.ru

      # 5. Ключ подписи ссылок (должен совпадать на обоих серверах!)
      - TOKEN_SECRET=${TOKEN_SECRET:-olymp-secret-key-2026-checker-secret-secure-salt-2026}

      # 6. Списки доступа администраторов
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-shurygin_egor,aemss72}
      - PROMPT_ADMIN_USERNAMES=${PROMPT_ADMIN_USERNAMES:-shurygin_egor,aemss72}

      # 7. Логирование
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TESTING_MODE=${TESTING_MODE:-false}

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
